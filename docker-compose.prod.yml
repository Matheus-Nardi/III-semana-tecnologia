services:
  # Banco de Dados Postgres (Produção)
  db:
    image: postgres:16-alpine
    container_name: semana-tecnologia-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-semana_tecnologia}
    volumes:
      - db-data-prod:/var/lib/postgresql/data
    networks:
      - app-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-semana_tecnologia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicação Next.js Standalone (Produção)
  nextjs:
    image: semana-tecnologia-prod:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semana-tecnologia-app-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - DATABASE_URI=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-semana_tecnologia}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - ADMIN_INITIAL_EMAIL=${ADMIN_INITIAL_EMAIL:-admin@unitins.br}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}
      - S3_ENABLED=${S3_ENABLED:-false}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_REGION=${S3_REGION:-us-east-005}
    networks:
      - app-network-prod
    volumes:
      - ./public:/app/public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backup diário do Postgres
  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: semana-tecnologia-backup-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-semana_tecnologia}
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=30
    volumes:
      - ./backups:/backups
    networks:
      - app-network-prod

  # Nginx como Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: semana-tecnologia-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - nextjs
    networks:
      - app-network-prod
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot para renovação automática de SSL
  certbot:
    image: certbot/certbot
    container_name: semana-tecnologia-certbot-prod
    restart: "no"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${CERTBOT_EMAIL:-suporte@unitins.br} --agree-tos --no-eff-email -d unitinscti.com.br -d www.unitinscti.com.br -d admin.unitinscti.com.br

volumes:
  db-data-prod: {}

networks:
  app-network-prod:
    driver: bridge