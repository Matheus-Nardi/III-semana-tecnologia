services:
  # Banco de Dados Postgres (Produção)
  db:
    image: postgres:16-alpine
    container_name: semana-tecnologia-db-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-semana_tecnologia}
    volumes:
      - db-data-prod:/var/lib/postgresql/data
    networks:
      - app-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-semana_tecnologia}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Aplicação Next.js Standalone (Produção)
  nextjs:
    image: ${APP_IMAGE:-semana-tecnologia-prod:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semana-tecnologia-app-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URI=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-semana_tecnologia}
    networks:
      - app-network-prod
    volumes:
      # Apenas os uploads do Payload ficam persistidos em volume Docker.
      # O restante de /app/public vem da imagem (assets gerados no build).
      - media-data-prod:/app/public/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backup diário do Postgres
  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: semana-tecnologia-backup-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=30
    volumes:
      - ./backups:/backups
    networks:
      - app-network-prod

  # Nginx como Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: semana-tecnologia-nginx-prod
    restart: unless-stopped
    environment:
      - STATS_USER=${STATS_USER:-stats}
      - STATS_HASH=${STATS_HASH}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
      - goaccess-reports:/var/reports:ro
      - ./monitor/nginx/htpasswd.template:/etc/nginx/templates/htpasswd.template:ro
    depends_on:
      - nextjs
    networks:
      - app-network-prod
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Certbot para renovação automática de SSL
  certbot:
    image: certbot/certbot
    container_name: semana-tecnologia-certbot-prod
    restart: "no"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${CERTBOT_EMAIL:-suporte@unitins.br} --agree-tos --no-eff-email -d unitinscti.com.br -d www.unitinscti.com.br -d admin.unitinscti.com.br

  # --------------------------------------------------------------------------
  # Observabilidade e segurança (stack mínima)
  # --------------------------------------------------------------------------

  # CrowdSec: detecta ataques lendo os logs do Nginx e envia alertas ao Telegram
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: semana-tecnologia-crowdsec-prod
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      - COLLECTIONS=crowdsecurity/nginx
      - GID=${GID:-1000}
      - TZ=America/Sao_Paulo
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - BOUNCER_KEY_firewall=${CS_BOUNCER_KEY}
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed -e "s|__BOT_TOKEN__|$$TELEGRAM_BOT_TOKEN|g" \
            -e "s|__CHAT_ID__|$$TELEGRAM_CHAT_ID|g" \
            /etc/crowdsec/notifications/_tpl/http.yaml.tpl \
            > /etc/crowdsec/notifications/http.yaml
        exec /bin/bash /docker_start.sh "$$@"
      - --
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./monitor/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./monitor/crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ./monitor/crowdsec/notifications/http.yaml.tpl:/etc/crowdsec/notifications/_tpl/http.yaml.tpl:ro
      - nginx-logs:/var/log/nginx:ro
      - crowdsec-db:/var/lib/crowdsec/data/
    networks:
      - app-network-prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Bouncer de firewall: aplica os BANs do CrowdSec no iptables do host (somente Linux)
  crowdsec-bouncer:
    image: ghcr.io/shgew/cs-firewall-bouncer-docker:stable
    container_name: semana-tecnologia-cs-bouncer-prod
    restart: unless-stopped
    depends_on:
      - crowdsec
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    environment:
      - API_URL=http://127.0.0.1:8080
      - API_KEY=${CS_BOUNCER_KEY}
    volumes:
      - ./monitor/crowdsec/bouncer.yaml:/config/crowdsec-firewall-bouncer.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Uptime Kuma: monitora saúde do site/banco/containers e alerta no Telegram
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: semana-tecnologia-kuma-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - app-network-prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Dozzle: visualização dos logs de todos os containers em tempo real
  dozzle:
    image: amir20/dozzle:latest
    container_name: semana-tecnologia-dozzle-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # GoAccess: painel de métricas de acesso (regenerado a cada 5 min) em /stats
  goaccess:
    image: allinurl/goaccess:latest
    container_name: semana-tecnologia-goaccess-prod
    restart: unless-stopped
    depends_on:
      - nginx
    entrypoint:
      - /bin/sh
      - -c
      - |
        while :; do
          goaccess /var/log/nginx/access.log -p /cfg/goaccess.conf -o /reports/index.html || true
          sleep 300
        done
    volumes:
      - ./monitor/goaccess/goaccess.conf:/cfg/goaccess.conf:ro
      - nginx-logs:/var/log/nginx:ro
      - goaccess-reports:/reports
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data-prod: {}
  media-data-prod: {}
  nginx-logs: {}
  goaccess-reports: {}
  crowdsec-db: {}
  uptime-kuma-data: {}

networks:
  app-network-prod:
    driver: bridge