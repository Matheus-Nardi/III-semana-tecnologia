services:
  # Banco de Dados Postgres (Produção)
  db:
    image: postgres:16-alpine
    container_name: semana-tecnologia-db-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-semana_tecnologia}
    volumes:
      - db-data-prod:/var/lib/postgresql/data
    networks:
      - app-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-semana_tecnologia}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Aplicação Next.js Standalone (Produção)
  nextjs:
    image: ${APP_IMAGE:-semana-tecnologia-prod:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semana-tecnologia-app-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URI=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-semana_tecnologia}
    networks:
      - app-network-prod
    volumes:
      # Apenas os uploads do Payload ficam persistidos em volume Docker.
      # O restante de /app/public vem da imagem (assets gerados no build).
      - media-data-prod:/app/public/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backup diário do Postgres
  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: semana-tecnologia-backup-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=30
    volumes:
      - ./backups:/backups
    networks:
      - app-network-prod

  # Nginx como Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: semana-tecnologia-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - nextjs
    networks:
      - app-network-prod
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Certbot para renovação automática de SSL
  certbot:
    image: certbot/certbot
    container_name: semana-tecnologia-certbot-prod
    restart: "no"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${CERTBOT_EMAIL:-suporte@unitins.br} --agree-tos --no-eff-email -d unitinscti.com.br -d www.unitinscti.com.br -d admin.unitinscti.com.br

volumes:
  db-data-prod: {}
  media-data-prod: {}

networks:
  app-network-prod:
    driver: bridge