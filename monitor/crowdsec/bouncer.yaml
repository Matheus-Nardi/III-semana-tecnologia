# Configuração do firewall bouncer (crowdsec-firewall-bouncer)
# Os placeholders ${API_URL} e ${API_KEY} são substituídos pelo entrypoint (envsubst)
api_url: ${API_URL}
api_key: ${API_KEY}
mode: iptables
update_frequency: 10s
daemonize: false
log_level: info
log_media: stdout
pid_dir: /var/run/
disable_ipv6: true

deny_action: DROP
deny_log: true
deny_log_prefix: "crowdsec: "
supported_decisions_types:
  - ban

blacklists_ipv4: crowdsec-blacklists
ipset_type: nethash

# DOCKER-USER é a chain correta para bloquear tráfego publicado pelo Docker
# (portas 80/443 não passam pela chain INPUT)
iptables_chains:
  - DOCKER-USER
iptables_add_rule_comments: true
