# Configuração do firewall bouncer (crowdsec-firewall-bouncer)
# ${API_URL} e ${API_KEY} são substituídos pelo entrypoint via envsubst
api_url: ${API_URL}
api_key: ${API_KEY}
mode: iptables
update_frequency: 10s
daemonize: false
log_level: info
log_media: stdout
pid_dir: /var/run/

iptables:
  # DOCKER-USER é a chain correta para tráfego publicado pelo Docker
  # (porta 80/443 não passa pela chain INPUT)
  chain_hook: DOCKER-USER
  rule_priority: 1
  deny_action: DROP
  deny_log: true
  deny_log_prefix: "crowdsec: "
