name: Deploy to Oracle VM

on:
  push:
    branches:
      - main
      - unstable
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      image_sha: ${{ steps.vars.outputs.image_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase image names
        id: vars
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
          echo "image=${REGISTRY}/${REPO}:${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "image_sha=${REGISTRY}/${REPO}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://unitinscti.com.br
          tags: |
            ${{ steps.vars.outputs.image }}
            ${{ steps.vars.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p "${{ secrets.DEPLOY_PATH }}"
            chmod 755 "${{ secrets.DEPLOY_PATH }}" || true
            # Remove stubs de diretório criados pelo Docker quando arquivos de monitor
            # estavam ausentes no deploy anterior (impede sobrescrever como arquivo)
            if [ -d "${{ secrets.DEPLOY_PATH }}/monitor" ]; then
              sudo rm -rf "${{ secrets.DEPLOY_PATH }}/monitor"
            fi

      - name: Upload deploy config to server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          source: "docker-compose.prod.yml,nginx,scripts,monitor"

      - name: Pull image and restart stack remotely
        uses: appleboy/ssh-action@v1.0.0
        env:
          GHCR_USER: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_IMAGE: ${{ needs.build-and-push.outputs.image }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,APP_IMAGE
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            mkdir -p certbot/conf certbot/www backups

            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            chmod +x scripts/restart.sh
            ./scripts/restart.sh

            echo "--- Health ---"
            SUCCESS=false
            for i in $(seq 1 12); do
              HTTP_CODE=$(docker exec semana-tecnologia-app-prod curl -s -o /dev/null -w "%{http_code}" --max-time 4 --connect-timeout 2 http://127.0.0.1:3000/api/health || true)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Next.js saudável (HTTP 200 na tentativa $i)"
                SUCCESS=true
                break
              fi
              echo "Aguardando Next.js inicializar... (tentativa $i/12 - status: ${HTTP_CODE:-sem conexão})"
              sleep 5
            done

            if [ "$SUCCESS" = false ]; then
              echo "❌ Next.js não respondeu com HTTP 200 no tempo limite."
              docker compose -f docker-compose.prod.yml logs --tail=100 nextjs
              exit 1
            fi

            echo "--- Verificando Nginx (proxy público 80/443) ---"
            NGX_OK=false
            for i in $(seq 1 10); do
              CODE=$(docker exec semana-tecnologia-nginx-prod wget -q -O /dev/null --no-check-certificate --header "Host: unitinscti.com.br" https://127.0.0.1/health 2>/dev/null && echo 200 || true)
              if [ "$CODE" = "200" ]; then
                echo "✅ Nginx respondendo (HTTP 200)"
                NGX_OK=true
                break
              fi
              echo "Aguardando Nginx... (tentativa $i/10)"
              sleep 6
            done

            if [ "$NGX_OK" = false ]; then
              echo "❌ Nginx não respondeu. Status dos containers:"
              docker compose -f docker-compose.prod.yml ps
              docker compose -f docker-compose.prod.yml logs --tail=50 nginx
              exit 1
            fi

            echo "--- Verificando serviços de monitoramento ---"
            docker compose -f docker-compose.prod.yml ps crowdsec crowdsec-bouncer goaccess uptime-kuma dozzle
