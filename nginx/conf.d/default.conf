# Upstream para o Next.js
upstream nextjs_upstream {
    server nextjs:3000;
    keepalive 32;
}

# Servidor HTTP (Fase 1 - Bootstrap / Validação ACME)
server {
    listen 80;
    server_name localhost 127.0.0.1 unitinscti.com.br www.unitinscti.com.br admin.unitinscti.com.br;
    
    # Permitir acesso ao Let's Encrypt para emissão/renovação
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        access_log off;
        try_files $uri $uri/ =404;
    }
    
    # Redirecionamento temporário ou proxy direto
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
